<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Morashop — Cajón Decisión (Quickshop drawer)</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700;800&display=swap" rel="stylesheet">
<style>
/* =========================================================
   MORASHOP — CAJON DECISION
   Drawer lateral (desktop) + bottom-sheet (mobile)
   ========================================================= */
:root{
  --mr-bg:        #ECEDEF;
  --mr-surface:   #FFFFFF;
  --mr-text:      #000E35;
  --mr-text-soft: rgba(0,14,53,.62);
  --mr-text-mute: rgba(0,14,53,.42);
  --mr-line:      rgba(0,14,53,.10);
  --mr-line-2:    rgba(0,14,53,.18);
  --mr-cta:       #E8341A;
  --mr-cta-h:     #C72D17;
  --mr-green:     #1FBA66;
  --mr-orange:    #FF8A1F;
  --mr-r-sm: 8px;
  --mr-r-md: 12px;
  --mr-r-lg: 16px;
  --mr-r-pill: 999px;
  --mr-sh-sm: 0 1px 2px rgba(0,14,53,.06), 0 1px 1px rgba(0,14,53,.04);
  --mr-sh-lg: 0 30px 60px -20px rgba(0,14,53,.30), 0 18px 36px -18px rgba(0,14,53,.22);
  --mr-tr-fast: 120ms cubic-bezier(.32,.72,0,1);
  --mr-tr-base: 220ms cubic-bezier(.32,.72,0,1);
  --mr-tr-slow: 320ms cubic-bezier(.32,.72,0,1);
  --mr-font-body:    'Inter', system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
  --mr-font-display: 'Barlow Condensed', 'Inter', sans-serif;
}

*{box-sizing:border-box}
html,body{margin:0;padding:0;font-family:var(--mr-font-body);color:var(--mr-text);background:var(--mr-bg);-webkit-font-smoothing:antialiased}

/* ---- demo fondo ---- */
.demo-grid{padding:40px;display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:16px;max-width:1400px;margin:0 auto}
.demo-card{aspect-ratio:1/1.2;background:var(--mr-surface);border-radius:12px;box-shadow:var(--mr-sh-sm)}
.demo-open{position:fixed;top:20px;left:20px;z-index:10;background:var(--mr-text);color:#fff;border:0;padding:12px 18px;border-radius:8px;font:600 13px var(--mr-font-body);cursor:pointer}

/* ========================================================= */
/* OVERLAY                                                    */
/* ========================================================= */
.mr-overlay{
  position:fixed; inset:0;
  background:rgba(0,14,53,.55);
  backdrop-filter: blur(2px);
  -webkit-backdrop-filter: blur(2px);
  opacity:0; pointer-events:none;
  transition:opacity var(--mr-tr-base);
  z-index:1000;
}
.mr-overlay.is-open{opacity:1;pointer-events:auto}

/* ========================================================= */
/* DRAWER (desktop default)                                   */
/* ========================================================= */
.mr-drawer{
  position:fixed; top:0; right:0; bottom:0;
  width:min(480px, 100vw);
  background:var(--mr-surface);
  box-shadow:var(--mr-sh-lg);
  display:flex; flex-direction:column;
  transform:translateX(100%);
  transition:transform var(--mr-tr-slow);
  z-index:1001;
  will-change:transform;
}
.mr-drawer.is-open{transform:translateX(0)}

/* ---- header ---- */
.mr-drawer__head{
  flex:0 0 auto;
  display:flex; justify-content:flex-end;
  padding:16px 16px 0;
}
.mr-close{
  width:44px; height:44px;
  display:inline-flex; align-items:center; justify-content:center;
  background:transparent; border:0; border-radius:var(--mr-r-pill);
  color:var(--mr-text); cursor:pointer;
  transition: background var(--mr-tr-fast);
}
.mr-close:hover{background:rgba(0,14,53,.06)}
.mr-close:focus-visible{outline:2px solid var(--mr-text);outline-offset:2px}
.mr-close svg{width:20px;height:20px}

/* ---- body scroll area ---- */
.mr-drawer__body{
  flex:1 1 auto;
  overflow-y:auto;
  padding:8px 32px 24px;
  scrollbar-width:thin;
}
.mr-drawer__body::-webkit-scrollbar{width:6px}
.mr-drawer__body::-webkit-scrollbar-thumb{background:var(--mr-line-2);border-radius:3px}

/* ---- image ---- */
.mr-image{
  position:relative;
  aspect-ratio:1/1;
  background:var(--mr-bg);
  border-radius:var(--mr-r-md);
  overflow:hidden;
  margin-bottom:20px;
}
.mr-image img{width:100%;height:100%;object-fit:cover;display:block}

/* ---- product head ---- */
.mr-name{
  font: 600 18px/1.25 var(--mr-font-body);
  color:var(--mr-text);
  margin:0 0 4px;
  letter-spacing:-.005em;
}
.mr-brand{
  font: 500 13px/1.3 var(--mr-font-body);
  color:var(--mr-text-soft);
  margin:0;
}

/* ---- hairline ---- */
.mr-hr{
  border:0; border-top:1px solid var(--mr-line);
  margin:18px 0;
}

/* ---- price ---- */
.mr-price-row{
  display:flex; align-items:baseline; gap:12px; flex-wrap:wrap;
}
.mr-price{
  font: 800 34px/1 var(--mr-font-display);
  color:var(--mr-text);
  letter-spacing:-.01em;
  font-feature-settings:"tnum" 1;
}
.mr-price-compare{
  font: 600 16px/1 var(--mr-font-display);
  color:var(--mr-text-mute);
  text-decoration:line-through;
  text-decoration-thickness:1.5px;
}
.mr-installments{
  margin-top:6px;
  font: 500 13px/1.3 var(--mr-font-body);
  color:var(--mr-text);
}
.mr-cash{
  margin-top:2px;
  font: 600 13px/1.3 var(--mr-font-body);
  color:var(--mr-green);
}

/* ---- section label ---- */
.mr-label{
  font: 700 11px/1 var(--mr-font-body);
  color:var(--mr-text-soft);
  text-transform:uppercase;
  letter-spacing:.08em;
  margin:0 0 12px;
}

/* ---- variant chips ---- */
.mr-chips{
  display:flex; flex-wrap:wrap; gap:8px;
}
.mr-chip{
  position:relative;
  min-height:48px;
  min-width:64px;
  padding:12px 18px;
  display:inline-flex; align-items:center; justify-content:center;
  background:var(--mr-surface);
  border:1.5px solid var(--mr-line-2);
  border-radius:var(--mr-r-pill);
  font: 500 14px/1 var(--mr-font-body);
  color:var(--mr-text);
  cursor:pointer;
  transition: border-color var(--mr-tr-fast), background var(--mr-tr-fast), color var(--mr-tr-fast), transform var(--mr-tr-fast);
  -webkit-tap-highlight-color:transparent;
}
.mr-chip:hover{
  border-color:var(--mr-text);
}
.mr-chip:focus-visible{
  outline:2px solid var(--mr-text);
  outline-offset:3px;
}
.mr-chip[aria-pressed="true"]{
  background:var(--mr-text);
  border-color:var(--mr-text);
  color:#fff;
  font-weight:600;
}
.mr-chip:active{transform:scale(.97)}
.mr-chip[disabled]{
  opacity:.4;
  cursor:not-allowed;
  text-decoration:line-through;
  text-decoration-thickness:1px;
}

/* ---- qty + stock row ---- */
.mr-qty-row{
  display:flex; align-items:center; justify-content:space-between; gap:16px;
}
.mr-qty-left{display:flex; flex-direction:column; gap:10px}
.mr-stock{
  font: 500 12px/1.3 var(--mr-font-body);
  color:var(--mr-text-soft);
  display:inline-flex; align-items:center; gap:6px;
}
.mr-stock::before{
  content:"";
  width:6px; height:6px;
  border-radius:50%;
  background:var(--mr-green);
  display:inline-block;
}
.mr-stock--low::before{background:var(--mr-orange)}

.mr-stepper{
  display:inline-flex; align-items:center;
  border:1.5px solid var(--mr-line-2);
  border-radius:var(--mr-r-pill);
  background:var(--mr-surface);
  overflow:hidden;
  height:48px;
}
.mr-stepper button{
  width:44px; height:46px;
  background:transparent; border:0;
  color:var(--mr-text);
  font-size:18px; cursor:pointer;
  display:inline-flex; align-items:center; justify-content:center;
  transition: background var(--mr-tr-fast);
}
.mr-stepper button:hover{background:rgba(0,14,53,.05)}
.mr-stepper button:focus-visible{outline:2px solid var(--mr-text);outline-offset:-2px}
.mr-stepper button:disabled{opacity:.3;cursor:not-allowed}
.mr-stepper input{
  width:48px; height:46px; border:0;
  text-align:center;
  font: 600 16px var(--mr-font-display);
  color:var(--mr-text);
  background:transparent;
  -moz-appearance:textfield;
}
.mr-stepper input::-webkit-outer-spin-button,
.mr-stepper input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.mr-stepper input:focus{outline:none}

/* ---- footer sticky CTA ---- */
.mr-drawer__foot{
  flex:0 0 auto;
  padding:16px 32px calc(16px + env(safe-area-inset-bottom));
  background:var(--mr-surface);
  border-top:1px solid var(--mr-line);
  box-shadow: 0 -8px 24px -16px rgba(0,14,53,.18);
}
.mr-cta{
  width:100%;
  min-height:56px;
  display:inline-flex; align-items:center; justify-content:center; gap:10px;
  background:var(--mr-cta);
  color:#fff;
  border:0;
  border-radius:var(--mr-r-md);
  font: 700 15px/1 var(--mr-font-body);
  letter-spacing:.02em;
  text-transform:uppercase;
  cursor:pointer;
  transition: background var(--mr-tr-fast), transform var(--mr-tr-fast);
}
.mr-cta:hover{background:var(--mr-cta-h)}
.mr-cta:active{transform:scale(.99)}
.mr-cta:focus-visible{outline:3px solid var(--mr-text);outline-offset:2px}
.mr-cta svg{width:18px;height:18px}

/* ========================================================= */
/* MOBILE — bottom sheet                                      */
/* ========================================================= */
@media (max-width: 768px){
  .mr-drawer{
    top:auto; left:0; right:0; bottom:0;
    width:100%;
    height:92vh; max-height:92vh;
    border-radius:20px 20px 0 0;
    transform:translateY(100%);
    transition:transform 260ms cubic-bezier(.32,.72,0,1);
  }
  .mr-drawer.is-open{transform:translateY(0)}
  .mr-drawer__head{
    position:relative;
    padding:8px 12px 0;
    justify-content:space-between;
    align-items:center;
  }
  .mr-drawer__head::before{
    content:"";
    position:absolute;
    top:8px; left:50%;
    transform:translateX(-50%);
    width:40px; height:4px;
    border-radius:2px;
    background:var(--mr-line-2);
  }
  .mr-drawer__head .mr-close{margin-left:auto;margin-top:8px}
  .mr-drawer__body{padding:8px 20px 20px}
  .mr-drawer__foot{padding:14px 20px calc(14px + env(safe-area-inset-bottom))}
  .mr-price{font-size:30px}
}

/* ========================================================= */
/* reduced motion                                             */
/* ========================================================= */
@media (prefers-reduced-motion: reduce){
  .mr-drawer, .mr-overlay, .mr-chip, .mr-cta, .mr-stepper button{
    transition: opacity 120ms linear !important;
  }
  .mr-drawer{transform:none;opacity:0}
  .mr-drawer.is-open{transform:none;opacity:1}
}
</style>
</head>
<body>

<!-- demo background -->
<button class="demo-open" id="demoOpen">Abrir Cajón Decisión</button>
<div class="demo-grid" aria-hidden="true">
  <div class="demo-card"></div><div class="demo-card"></div><div class="demo-card"></div>
  <div class="demo-card"></div><div class="demo-card"></div><div class="demo-card"></div>
  <div class="demo-card"></div><div class="demo-card"></div><div class="demo-card"></div>
  <div class="demo-card"></div><div class="demo-card"></div><div class="demo-card"></div>
</div>

<!-- ==================== OVERLAY ==================== -->
<div class="mr-overlay" id="mrOverlay" aria-hidden="true"></div>

<!-- ==================== DRAWER ==================== -->
<aside class="mr-drawer" id="mrDrawer"
       role="dialog" aria-modal="true" aria-labelledby="mrName"
       aria-hidden="true">

  <header class="mr-drawer__head">
    <button class="mr-close" id="mrClose" type="button" aria-label="Cerrar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
      </svg>
    </button>
  </header>

  <div class="mr-drawer__body">

    <!-- IMAGE -->
    <div class="mr-image">
      <img src="https://acdn.mitiendanube.com/stores/001/234/567/products/whey-true-made-chocolate1.jpg"
           alt="Star Nutrition Whey True Made 2lb sabor Chocolate Suizo"
           onerror="this.style.display='none'">
    </div>

    <!-- HEAD -->
    <h2 class="mr-name" id="mrName">Whey True Made 2 LB</h2>
    <p class="mr-brand">Star Nutrition</p>

    <hr class="mr-hr">

    <!-- PRICE -->
    <div class="mr-price-block">
      <div class="mr-price-row">
        <span class="mr-price">$24.990</span>
        <span class="mr-price-compare">$32.500</span>
      </div>
      <p class="mr-installments">3 cuotas sin interés de <strong>$8.330</strong></p>
      <p class="mr-cash">$22.491 con efectivo o transferencia (-10%)</p>
    </div>

    <hr class="mr-hr">

    <!-- VARIANTS -->
    <p class="mr-label">Sabor</p>
    <div class="mr-chips" role="radiogroup" aria-label="Sabor">
      <button class="mr-chip" type="button" role="radio" aria-checked="false" aria-pressed="false">Banana</button>
      <button class="mr-chip" type="button" role="radio" aria-checked="true"  aria-pressed="true">Chocolate Suizo</button>
      <button class="mr-chip" type="button" role="radio" aria-checked="false" aria-pressed="false">Frutilla</button>
      <button class="mr-chip" type="button" role="radio" aria-checked="false" aria-pressed="false">Cookies &amp; Cream</button>
      <button class="mr-chip" type="button" role="radio" aria-checked="false" aria-pressed="false">Vainilla Ice</button>
    </div>

    <hr class="mr-hr">

    <!-- QTY + STOCK -->
    <div class="mr-qty-row">
      <div class="mr-qty-left">
        <p class="mr-label" style="margin:0">Cantidad</p>
        <div class="mr-stepper" role="group" aria-label="Cantidad">
          <button type="button" id="mrMinus" aria-label="Disminuir cantidad">−</button>
          <input type="number" id="mrQty" value="1" min="1" max="99" aria-label="Cantidad">
          <button type="button" id="mrPlus"  aria-label="Aumentar cantidad">+</button>
        </div>
      </div>
      <span class="mr-stock" aria-live="polite">+100 en stock</span>
    </div>

  </div>

  <!-- FOOTER STICKY CTA -->
  <footer class="mr-drawer__foot">
    <button class="mr-cta" type="submit">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/>
        <path d="M1 1h4l2.7 13.4a2 2 0 0 0 2 1.6h9.7a2 2 0 0 0 2-1.6L23 6H6"/>
      </svg>
      Agregar al carrito
    </button>
  </footer>
</aside>

<script>
(function(){
  var drawer  = document.getElementById('mrDrawer');
  var overlay = document.getElementById('mrOverlay');
  var openBtn = document.getElementById('demoOpen');
  var closeBtn= document.getElementById('mrClose');
  var lastFocus = null;

  function open(){
    lastFocus = document.activeElement;
    drawer.classList.add('is-open');
    overlay.classList.add('is-open');
    drawer.setAttribute('aria-hidden','false');
    document.body.style.overflow='hidden';
    setTimeout(function(){ closeBtn.focus(); }, 60);
  }
  function close(){
    drawer.classList.remove('is-open');
    overlay.classList.remove('is-open');
    drawer.setAttribute('aria-hidden','true');
    document.body.style.overflow='';
    if(lastFocus) lastFocus.focus();
  }
  openBtn.addEventListener('click', open);
  closeBtn.addEventListener('click', close);
  overlay.addEventListener('click', close);
  document.addEventListener('keydown', function(e){
    if(e.key==='Escape' && drawer.classList.contains('is-open')) close();
  });

  // chips radiogroup
  var chips = drawer.querySelectorAll('.mr-chip');
  chips.forEach(function(c){
    c.addEventListener('click', function(){
      chips.forEach(function(x){ x.setAttribute('aria-checked','false'); x.setAttribute('aria-pressed','false'); });
      c.setAttribute('aria-checked','true');
      c.setAttribute('aria-pressed','true');
    });
  });

  // stepper
  var qty   = document.getElementById('mrQty');
  document.getElementById('mrMinus').addEventListener('click', function(){
    qty.value = Math.max(1, (parseInt(qty.value,10)||1) - 1);
  });
  document.getElementById('mrPlus').addEventListener('click', function(){
    qty.value = Math.min(99, (parseInt(qty.value,10)||1) + 1);
  });
})();
</script>

</body>
</html>
