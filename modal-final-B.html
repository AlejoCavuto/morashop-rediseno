<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Finalista B — Cajón Lateral Decisión</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#000e35;
  --navy-2:#0F1B3D;
  --red:#E8341A;
  --red-deep:#C72D17;
  --orange:#FF8A1F;
  --green:#1FBA66;
  --muted:#8a8f9c;
  --mute2:rgba(0,14,53,.42);
  --line:#EFEFF2;
  --line-strong:rgba(0,14,53,.10);
  --img-bg:#ECEDEF;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0;font-family:'Inter',system-ui,sans-serif;color:var(--navy);background:#fafafa;-webkit-font-smoothing:antialiased}

/* HEADER BAR */
.finalist-header{position:fixed;top:0;left:0;right:0;z-index:20000;background:var(--navy);color:#fff;padding:12px 20px;display:flex;align-items:center;justify-content:space-between;gap:16px;box-shadow:0 2px 12px rgba(0,14,53,.15)}
.finalist-header-info{display:flex;flex-direction:column;gap:2px;min-width:0}
.finalist-header-name{font-family:'Inter',sans-serif;font-size:14px;font-weight:700;letter-spacing:.02em;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.finalist-header-name span{color:var(--red);margin-right:6px}
.finalist-header-tagline{font-family:'Inter',sans-serif;font-size:12px;font-weight:400;color:rgba(255,255,255,.7);margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.finalist-header-back{font-family:'Inter',sans-serif;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#fff;text-decoration:none;border:1px solid rgba(255,255,255,.3);padding:8px 14px;border-radius:6px;white-space:nowrap;transition:background .12s ease,border-color .12s ease;flex-shrink:0}
.finalist-header-back:hover{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.5)}
.finalist-header-back:focus-visible{outline:2px solid var(--red);outline-offset:2px}
@media (max-width:600px){
  .finalist-header-tagline{display:none}
  .finalist-header{padding:10px 14px}
  .finalist-header-back{padding:6px 10px;font-size:11px}
}

.demo-page{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:80px 24px 24px}
.demo-btn{font-family:'Inter',sans-serif;font-weight:700;font-size:14px;letter-spacing:.04em;text-transform:uppercase;background:var(--navy);color:#fff;border:0;padding:16px 32px;border-radius:8px;cursor:pointer;transition:background .12s ease}
.demo-btn:hover{background:var(--navy-2)}

/* OVERLAY */
.mr-overlay{position:fixed;inset:0;background:rgba(0,14,53,.42);opacity:0;visibility:hidden;transition:opacity .22s cubic-bezier(.32,.72,0,1),visibility .22s;z-index:9998;backdrop-filter:blur(2px)}
.mr-overlay.is-open{opacity:1;visibility:visible}

/* DRAWER (desktop = right side) */
.mr-drawer{position:fixed;top:0;right:0;bottom:0;width:min(480px,100vw);background:#fff;box-shadow:-24px 0 64px rgba(0,14,53,.18);transform:translateX(100%);visibility:hidden;z-index:9999;display:flex;flex-direction:column;transition:transform .32s cubic-bezier(.32,.72,0,1),visibility .32s}
.mr-drawer.is-open{transform:translateX(0);visibility:visible}

/* HEAD */
.mr-drawer__head{position:relative;padding:18px 24px;border-bottom:1px solid var(--line-strong);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.mr-drawer__head-title{font-family:'Inter',sans-serif;font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--mute2);margin:0}
.mr-close{width:44px;height:44px;display:flex;align-items:center;justify-content:center;background:#fff;border:1px solid var(--line-strong);border-radius:50%;cursor:pointer;color:var(--navy);transition:background .12s ease}
.mr-close:hover{background:#fafafa}
.mr-close:focus-visible{outline:2px solid var(--navy);outline-offset:2px}
.mr-close svg{width:16px;height:16px}

/* BODY */
.mr-drawer__body{flex:1;overflow-y:auto;padding:24px}

/* IMAGE */
.mr-image{position:relative;background:var(--img-bg);border-radius:12px;aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;padding:32px;margin-bottom:20px}
.mr-image::after{content:"";position:absolute;left:24px;right:24px;bottom:0;height:1px;background:var(--line-strong)}
.mr-image img{max-width:100%;max-height:100%;object-fit:contain;mix-blend-mode:multiply}

/* INFO */
.mr-brand{font-family:'Inter',sans-serif;font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--mute2);margin:0 0 6px}
.mr-name{font-family:'Inter',sans-serif;font-weight:700;font-size:20px;line-height:1.25;letter-spacing:-.01em;margin:0 0 16px;color:var(--navy)}

.mr-price-row{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:4px}
.mr-price{font-family:'Inter',sans-serif;font-weight:800;font-size:28px;letter-spacing:-.02em;color:var(--navy);font-variant-numeric:tabular-nums;line-height:1}
.mr-was{font-family:'Inter',sans-serif;font-weight:500;font-size:14px;color:var(--mute2);text-decoration:line-through;font-variant-numeric:tabular-nums}
.mr-badge{display:inline-block;font-family:'Inter',sans-serif;font-weight:700;font-size:11px;letter-spacing:.06em;color:var(--red);border:1.5px solid var(--red);padding:3px 7px;border-radius:4px;text-transform:uppercase}
.mr-cuotas{font-family:'Inter',sans-serif;font-size:13px;font-weight:500;color:var(--navy);margin:0 0 22px;font-variant-numeric:tabular-nums}
.mr-cuotas strong{color:var(--green);font-weight:700}

.mr-divider{height:1px;background:var(--line-strong);margin:0 0 20px}

/* VARIANT */
.mr-variant-label{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:10px}
.mr-variant-title{font-family:'Inter',sans-serif;font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--mute2)}
.mr-variant-value{font-family:'Inter',sans-serif;font-size:13px;font-weight:600;color:var(--navy)}
.mr-chips{list-style:none;margin:0 0 24px;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:8px}
.mr-chip{position:relative;display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 14px;font-family:'Inter',sans-serif;font-size:13px;font-weight:500;color:var(--navy);background:#fff;border:1px solid var(--line-strong);border-radius:10px;cursor:pointer;transition:background .12s,color .12s,border-color .12s,transform .12s;font-variant-numeric:tabular-nums;width:100%}
.mr-chip:hover{border-color:var(--navy)}
.mr-chip:active{transform:scale(.97)}
.mr-chip[aria-checked="true"]{background:var(--navy);color:#fff;border-color:var(--navy);font-weight:600}
.mr-chip:focus-visible{outline:2px solid var(--navy);outline-offset:2px}
.mr-chip[aria-disabled="true"]{color:var(--mute2);text-decoration:line-through;cursor:not-allowed;background:#fafafa}

/* QTY + STOCK */
.mr-qty-row{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:14px}
.mr-qty-label{font-family:'Inter',sans-serif;font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--mute2)}
.mr-stepper{display:inline-flex;align-items:center;border:1px solid var(--line-strong);border-radius:10px;overflow:hidden}
.mr-stepper button{width:44px;height:46px;background:#fff;border:0;cursor:pointer;font-family:'Inter',sans-serif;font-size:18px;font-weight:600;color:var(--navy);transition:background .12s ease}
.mr-stepper button:hover{background:#fafafa}
.mr-stepper button:focus-visible{outline:2px solid var(--navy);outline-offset:-2px}
.mr-stepper input{width:42px;height:46px;border:0;border-left:1px solid var(--line-strong);border-right:1px solid var(--line-strong);text-align:center;font-family:'Inter',sans-serif;font-size:15px;font-weight:600;color:var(--navy);font-variant-numeric:tabular-nums;-moz-appearance:textfield;background:#fff}
.mr-stepper input::-webkit-outer-spin-button,.mr-stepper input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.mr-stock{font-family:'Inter',sans-serif;font-size:13px;font-weight:500;color:var(--navy);display:flex;align-items:center;gap:6px;margin:0}
.mr-stock-dot{width:6px;height:6px;background:var(--green);border-radius:50%;display:inline-block}

/* FOOT */
.mr-drawer__foot{padding:16px 24px;background:#fff;border-top:1px solid var(--line-strong);flex-shrink:0;box-shadow:0 -4px 16px rgba(0,14,53,.04)}
.mr-cta{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;height:56px;background:var(--red);color:#fff;border:0;border-radius:10px;font-family:'Inter',sans-serif;font-size:14px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;transition:background .12s ease,transform .12s ease}
.mr-cta:hover{background:var(--red-deep)}
.mr-cta:active{transform:scale(.99)}
.mr-cta:focus-visible{outline:3px solid rgba(232,52,26,.35);outline-offset:2px}
.mr-cta svg{width:20px;height:20px;flex-shrink:0}

/* MOBILE BOTTOM-SHEET */
@media (max-width:768px){
  .mr-drawer{top:auto;right:0;left:0;bottom:0;width:100%;max-width:100%;height:88dvh;max-height:88dvh;border-radius:20px 20px 0 0;transform:translateY(100%);box-shadow:0 -24px 64px rgba(0,14,53,.18)}
  .mr-drawer.is-open{transform:translateY(0)}
  .mr-drawer__head::before{content:"";position:absolute;top:8px;left:50%;transform:translateX(-50%);width:40px;height:4px;background:var(--line-strong);border-radius:999px}
  .mr-drawer__head{padding-top:24px}
  .mr-image{aspect-ratio:1/1;padding:24px;max-height:36vh}
  .mr-drawer__body{padding:20px}
  .mr-name{font-size:18px}
  .mr-price{font-size:26px}
  .mr-drawer__foot{padding:14px 20px calc(14px + env(safe-area-inset-bottom)) 20px}
}

/* REDUCED MOTION */
@media (prefers-reduced-motion:reduce){
  .mr-overlay,.mr-drawer,.mr-chip,.mr-cta,.mr-stepper button{transition:none!important;animation:none!important}
  .mr-drawer{transform:translateX(0)!important}
  @media (max-width:768px){.mr-drawer{transform:translateY(0)!important}}
}
</style>
</head>
<body>

<header class="finalist-header">
  <div class="finalist-header-info">
    <h1 class="finalist-header-name"><span>B</span>Cajón Lateral Decisión</h1>
    <p class="finalist-header-tagline">Entra desde el costado, no tapa el catálogo: el usuario sigue viendo dónde estaba.</p>
  </div>
  <a href="modal-finalists-index.html" class="finalist-header-back">&larr; Volver al index</a>
</header>

<div class="demo-page">
  <button class="demo-btn" id="openBtn">Reabrir modal</button>
</div>

<div class="mr-overlay is-open" id="mrOverlay"></div>

<aside class="mr-drawer is-open" id="mrDrawer" role="dialog" aria-modal="true" aria-labelledby="mrName">
  <header class="mr-drawer__head">
    <h3 class="mr-drawer__head-title">Compra rápida</h3>
    <button class="mr-close" id="mrClose" aria-label="Cerrar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg>
    </button>
  </header>

  <div class="mr-drawer__body">
    <div class="mr-image">
      <img src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 200'><rect width='200' height='200' fill='%23ECEDEF'/><rect x='40' y='20' width='120' height='160' rx='8' fill='%23000e35'/><text x='100' y='90' font-family='Arial' font-size='14' font-weight='700' fill='white' text-anchor='middle'>STAR</text><text x='100' y='115' font-family='Arial' font-size='10' fill='white' text-anchor='middle'>WHEY</text><text x='100' y='135' font-family='Arial' font-size='10' fill='white' text-anchor='middle'>PROTEIN</text><text x='100' y='165' font-family='Arial' font-size='8' fill='%23FF8A1F' text-anchor='middle'>CHOCOLATE</text></svg>" alt="Whey Protein Star Nutrition Chocolate">
    </div>

    <p class="mr-brand">Star Nutrition</p>
    <h2 class="mr-name" id="mrName">Whey Protein 1kg</h2>

    <div class="mr-price-row">
      <span class="mr-price">$24.990</span>
      <span class="mr-was">$29.990</span>
      <span class="mr-badge">-17%</span>
    </div>
    <p class="mr-cuotas">3 cuotas sin interés de <strong>$8.330</strong></p>

    <div class="mr-divider"></div>

    <div class="mr-variant-label">
      <span class="mr-variant-title">Sabor</span>
      <span class="mr-variant-value" id="mrVariantValue">Chocolate</span>
    </div>
    <ul class="mr-chips" role="radiogroup" aria-label="Sabor">
      <li><button class="mr-chip" role="radio" aria-checked="true" aria-pressed="true" data-variant="Chocolate">Chocolate</button></li>
      <li><button class="mr-chip" role="radio" aria-checked="false" aria-pressed="false" data-variant="Vainilla">Vainilla</button></li>
      <li><button class="mr-chip" role="radio" aria-checked="false" aria-pressed="false" data-variant="Frutilla">Frutilla</button></li>
      <li><button class="mr-chip" role="radio" aria-checked="false" aria-pressed="false" data-variant="Cookies">Cookies</button></li>
      <li><button class="mr-chip" role="radio" aria-checked="false" aria-pressed="false" aria-disabled="true" data-variant="DDL">D. de Leche</button></li>
    </ul>

    <div class="mr-qty-row">
      <span class="mr-qty-label">Cantidad</span>
      <div class="mr-stepper" role="group" aria-label="Cantidad">
        <button id="mrMinus" aria-label="Restar uno">&minus;</button>
        <input type="number" id="mrQty" value="1" min="1" max="99" aria-label="Cantidad">
        <button id="mrPlus" aria-label="Sumar uno">+</button>
      </div>
    </div>

    <p class="mr-stock" aria-live="polite">
      <span class="mr-stock-dot"></span>
      12 disponibles
    </p>
  </div>

  <footer class="mr-drawer__foot">
    <button class="mr-cta" id="mrCta" aria-label="Agregar al carrito por 24.990 pesos">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
      <span>Agregar al carrito</span>
    </button>
  </footer>
</aside>

<script>
const openBtn=document.getElementById('openBtn');
const overlay=document.getElementById('mrOverlay');
const drawer=document.getElementById('mrDrawer');
const closeBtn=document.getElementById('mrClose');
const chips=document.querySelectorAll('.mr-chip');
const variantValue=document.getElementById('mrVariantValue');
const minus=document.getElementById('mrMinus');
const plus=document.getElementById('mrPlus');
const qty=document.getElementById('mrQty');

function openDrawer(){overlay.classList.add('is-open');drawer.classList.add('is-open');document.body.style.overflow='hidden'}
function closeDrawer(){overlay.classList.remove('is-open');drawer.classList.remove('is-open');document.body.style.overflow=''}

openBtn.addEventListener('click',openDrawer);
closeBtn.addEventListener('click',closeDrawer);
overlay.addEventListener('click',closeDrawer);
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&drawer.classList.contains('is-open'))closeDrawer()});

chips.forEach(chip=>{
  chip.addEventListener('click',()=>{
    if(chip.getAttribute('aria-disabled')==='true')return;
    chips.forEach(c=>{c.setAttribute('aria-checked','false');c.setAttribute('aria-pressed','false')});
    chip.setAttribute('aria-checked','true');chip.setAttribute('aria-pressed','true');
    variantValue.textContent=chip.textContent;
  });
});

minus.addEventListener('click',()=>{const v=parseInt(qty.value)||1;if(v>1)qty.value=v-1});
plus.addEventListener('click',()=>{const v=parseInt(qty.value)||1;if(v<99)qty.value=v+1});

document.body.style.overflow='hidden';
</script>
</body>
</html>
